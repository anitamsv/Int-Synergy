<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>Team Kebab Artifacts</title>
  <style>
    @font-face {
      font-family: 'Munchee';
      src: url('assets/fonts/Munchee Personal Use Only.ttf') format('truetype');
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      overflow-x: hidden;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #f5f5f5;
    }

    .site-header {
      width: 100%;
      padding: 25px 20px 10px 50px;
      text-align: left;
    }

    .group-title {
      font-family: 'Munchee', sans-serif;
      font-size: clamp(1.8rem, 4vw, 3.2rem);
      color: #1a1a1a;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .poster-wrapper {
      position: relative;
      display: inline-block;
      max-width: 100%;
      max-height: calc(100vh - 100px);
      margin-bottom: 15px;
    }

    .base-poster {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 100px);
      object-fit: contain;
    }

    .country-card {
      position: absolute;
      cursor: pointer;
    }

    .img-default, 
    .img-hover {
      width: 100%;
      display: block;
    }

    .img-default {
      width: 100%;
      display: block;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      transition: clip-path 0.4s ease-in-out;
    }

    .img-hover {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      clip-path: polygon(0 0, 0 0, 0 100%, 0 100%);
      transition: clip-path 0.5s ease-in-out 0.3s;
    }

    .country-card:hover .img-default {
      clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%);
    }

    .country-card:hover .img-hover {
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    }

    .russia .img-hover {
      top: 1%;
      left: -4%;
      width: 105%;
    }

    .iran .img-hover {
      top: -2%;
      left: 1%;
      width: 99%;
      height: 104%;
    }

    .netherlands .img-hover {
      top: 2.5%;
      left: 2.5%;
      width: 96%;
      height: 96%;
    }

    .russia {
      top: 20.5%;
      left: 5.9%;
      width: 48.5%;
      z-index: 1;
    }

    .iran {
      top: 36.3%;
      right: 6.5%;
      width: 49%;
      z-index: 2;
    }

    .netherlands {
      bottom: 22.2%;
      right: 37%;
      width: 51%;
      z-index: 3;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <h1 class="group-title">TEAM KEBAB</h1>
  </header>

  <div class="poster-wrapper">
    
    <img src="assets/images/Template 3.png" alt="Poster Template" class="base-poster">

    <div class="country-card russia">
      <img src="assets/images/Russia.png" alt="Russia" class="img-default">
      <img src="assets/images/Russia_Example.png" alt="Russia Example" class="img-hover">
    </div>

    <div class="country-card iran">
      <img src="assets/images/Iran.png" alt="Iran" class="img-default">
      <img src="assets/images/Iran_Example.png" alt="Iran Example" class="img-hover">
    </div>

    <div class="country-card netherlands">
      <img src="assets/images/Netherlands.png" alt="Netherlands" class="img-default">
      <img src="assets/images/Netherlands_Example.png" alt="Netherlands Example" class="img-hover">
    </div> 

  </div>

</body>
</html>
